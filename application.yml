# ==================== 服务器额外配置 ====================
# Dockerfile 显式加载 classpath 基础配置和此部署覆盖文件。
# 此文件可添加/覆盖 Spring Boot 配置（如日志级别、自定义参数等）
# 数据库连接建议通过 .env 配置（环境变量优先级更高）
server:
  tomcat:
    max-threads: 200        # 最大工作线程数
    accept-count: 100        # 等待队列长度
    max-connections: 10000    # 最大连接数
# RocketMQ 配置留给 classpath 下的 application.yml 或环境变量
# Docker 启动时会通过环境变量 MQ_NAMESERVER_ADDR 覆盖

logging:
  level:
    com.imooc.miaoshaproject: DEBUG
    org.springframework: INFO
