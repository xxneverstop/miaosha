# App + MySQL only; Redis and RocketMQ must already be reachable from the app container.
# .env supplies deployment values; exported shell variables take precedence in Compose.
services:
  app:
    build: .
    container_name: miaosha-app
    ports:
      - "18091:18091"
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx512m -Duser.timezone=Asia/Shanghai}
      # MYSQL_PORT is the host mapping; app-to-MySQL traffic uses the container port.
      SPRING_DATASOURCE_URL: jdbc:mysql://${MYSQL_HOST:-mysql}:3306/${MYSQL_DATABASE:-miaosha}?useUnicode=true&characterEncoding=UTF-8&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      SPRING_REDIS_HOST: ${REDIS_HOST:?Set a container-reachable REDIS_HOST in .env}
      SPRING_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MQ_NAMESERVER_ADDR: ${MQ_NAMESERVER_ADDR:?Set a container-reachable MQ_NAMESERVER_ADDR in .env}
      MQ_TOPICNAME: ${MQ_TOPICNAME:-stock_topic}
    volumes:
      - ./application.yml:/home/xiong/miaosha/application.yml:ro
      - ./logs:/app/logs
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1.5g

  mysql:
    image: mysql:5.7
    container_name: miaosha-mysql
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      # Initialization creates root only; provision any custom MYSQL_USERNAME separately.
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-miaosha}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    deploy:
      resources:
        limits:
          memory: 400m
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
